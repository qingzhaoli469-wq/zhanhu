<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>浩记 · AI Token Vault Pro</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f0f1a">
<style>
  :root {
    --bg: #09090e; --surface: #14141f; --surface2: #1c1c2a; --border: #27273a;
    --primary: #5c5cff; --text: #ededed; --text2: #8a8a9e;
    --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh; }
  
  /* UI 元素 */
  .btn { padding: 10px 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface2); color: var(--text); font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; transition: all 0.2s; }
  .btn:active { transform: scale(0.97); opacity: 0.8; }
  .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn-danger { border-color: rgba(239,68,68,0.4); color: var(--danger); }
  .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 8px; }
  
  .header { padding: 16px; background: rgba(20,20,31,0.85); backdrop-filter: blur(16px); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
  .logo { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; letter-spacing: 0.5px; }
  .logo-icon { width: 28px; height: 28px; background: linear-gradient(135deg, #5c5cff, #a855f7); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  
  /* 仪表盘 */
  .dashboard { padding: 16px; max-width: 800px; margin: 0 auto; }
  .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .stat-box { background: var(--surface); padding: 16px; border-radius: var(--radius); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; }
  .stat-box .label { font-size: 12px; color: var(--text2); }
  .stat-box .val { font-size: 24px; font-weight: 700; font-family: monospace; }
  .val.cny { color: var(--success); }
  .val.usd { color: #60a5fa; }
  .val.warn { color: var(--danger); }

  /* 工具栏 */
  .toolbar { display: flex; gap: 8px; margin-bottom: 16px; }
  .search-input { flex: 1; padding: 12px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 14px; outline: none; transition: border 0.2s; }
  .search-input:focus { border-color: var(--primary); }

  /* 站点卡片 */
  .site-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; position: relative; overflow: hidden; }
  .site-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .site-name { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .status-dot.active { background: var(--success); box-shadow: 0 0 8px var(--success); }
  .status-dot.error { background: var(--danger); }
  .status-dot.unknown { background: var(--text2); }
  .tag { padding: 2px 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; font-size: 11px; color: var(--text2); }
  
  .key-row { display: flex; align-items: center; justify-content: space-between; background: var(--bg); padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; border: 1px solid var(--border); }
  .key-text { font-family: monospace; font-size: 13px; color: var(--text); letter-spacing: 0.5px; }
  .balance-info { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 13px; }
  .balance-amount { font-family: monospace; font-weight: 600; font-size: 16px; }

  /* 弹窗 */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 999; align-items: flex-end; justify-content: center; }
  @media (min-width: 600px) { .modal-overlay { align-items: center; } }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 24px 24px 0 0; padding: 24px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
  @media (min-width: 600px) { .modal { border-radius: 20px; } }
  
  /* 表单 */
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 6px; font-weight: 500; }
  .form-control { width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 15px; outline: none; }
  .form-control:focus { border-color: var(--primary); }
  
  /* 锁屏 */
  .lock-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
  .lock-card { background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 32px 24px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
  
  .toast-container { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 9999; width: 90%; max-width: 300px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .toast { padding: 12px 16px; border-radius: 10px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); font-size: 13px; text-align: center; animation: slideUp 0.3s; }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .hidden { display: none !important; }
  
  /* 加载动画 */
  .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- 锁屏 -->
<div class="lock-screen" id="lockScreen">
  <div class="lock-card" id="unlockView">
    <div style="font-size: 48px; margin-bottom: 16px;">🔐</div>
    <h1 style="font-size: 22px; margin-bottom: 8px;">浩记 · Token Vault</h1>
    <p style="color: var(--text2); font-size: 13px; margin-bottom: 24px;">本地优先 · 加密存储 · 强隔离</p>
    <div class="form-group"><input type="password" id="masterPwd" class="form-control" placeholder="输入主密码" onkeydown="if(event.key==='Enter') unlock()"></div>
    <button class="btn btn-primary" style="width: 100%; padding: 12px;" onclick="unlock()">解锁</button>
    <div style="margin-top: 16px; font-size: 12px; color: var(--text2);">没有保险箱？<a href="#" onclick="showCreate()" style="color: var(--primary); text-decoration: none;">立即创建</a></div>
  </div>
  
  <div class="lock-card hidden" id="createView">
    <div style="font-size: 48px; margin-bottom: 16px;">🛡️</div>
    <h1 style="font-size: 22px; margin-bottom: 8px;">创建保险箱</h1>
    <p style="color: var(--text2); font-size: 13px; margin-bottom: 24px;">密码用于加密所有数据，遗忘不可找回</p>
    <div class="form-group"><input type="password" id="newPwd" class="form-control" placeholder="设置主密码"></div>
    <div class="form-group"><input type="password" id="confirmPwd" class="form-control" placeholder="确认主密码"></div>
    <button class="btn btn-primary" style="width: 100%; padding: 12px;" onclick="createVault()">创建并进入</button>
    <div style="margin-top: 16px; font-size: 12px;"><a href="#" onclick="hideCreate()" style="color: var(--text2); text-decoration: none;">返回解锁</a></div>
  </div>
</div>

<!-- 主应用 -->
<div id="mainApp" class="hidden">
  <div class="header">
    <div class="logo"><div class="logo-icon">⚡</div>Token Vault Pro</div>
    <div style="display: flex; gap: 8px;">
      <button class="btn btn-sm" onclick="exportVault()">导出</button>
      <button class="btn btn-sm btn-primary" onclick="lockVault()">锁定</button>
    </div>
  </div>

  <div class="dashboard">
    <!-- 仪表盘 -->
    <div class="stats-row">
      <div class="stat-box">
        <span class="label">CNY 余额合计</span>
        <span class="val cny" id="totalCny">¥0.00</span>
      </div>
      <div class="stat-box">
        <span class="label">USD 余额合计</span>
        <span class="val usd" id="totalUsd">$0.00</span>
      </div>
      <div class="stat-box" style="grid-column: span 2; flex-direction: row; justify-content: space-between; align-items: center;">
        <div>
          <span class="label">站点监控</span>
          <span class="val" style="font-size: 18px;" id="siteCount">0 个站点</span>
        </div>
        <button class="btn btn-primary" onclick="refreshAllBalances()" id="refreshBtn">刷新全部余额</button>
      </div>
    </div>

    <!-- 工具栏 -->
    <div class="toolbar">
      <input type="text" id="searchInput" class="search-input" placeholder="搜索站点名称..." oninput="renderList()">
      <button class="btn btn-primary" onclick="openModal()" style="white-space: nowrap;">＋ 添加站点</button>
    </div>

    <!-- 列表 -->
    <div id="siteList"></div>
  </div>
</div>

<!-- 添加/编辑弹窗 -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h2 style="margin-bottom: 20px; font-size: 18px;" id="modalTitle">配置站点</h2>
    
    <div class="form-group">
      <label>站点名称</label>
      <input type="text" id="fName" class="form-control" placeholder="如 DeepSeek, OpenRouter">
    </div>
    <div class="form-group">
      <label>API Key</label>
      <input type="password" id="fKey" class="form-control" placeholder="sk-...">
    </div>
    <div class="form-group">
      <label>平台类型 (用于自动识别余额接口)</label>
      <select id="fProvider" class="form-control">
        <option value="auto">自动识别</option>
        <option value="deepseek">DeepSeek 官方</option>
        <option value="openrouter">OpenRouter</option>
        <option value="moonshot">Moonshot / Kimi</option>
        <option value="siliconflow">SiliconFlow 硅基流动</option>
        <option value="newapi">中转站 / new-api</option>
      </select>
    </div>
    <div class="form-group">
      <label>自定义 Base URL (选填)</label>
      <input type="text" id="fBaseUrl" class="form-control" placeholder="https://api.example.com">
    </div>
    
    <!-- 高级设置 -->
    <details style="margin-bottom: 20px; background: var(--surface2); padding: 12px; border-radius: 10px; border: 1px solid var(--border);">
      <summary style="font-size: 13px; color: var(--primary); cursor: pointer; font-weight: 500;">高级：自定义 JSON 解析规则 (无需写代码)</summary>
      <div style="margin-top: 12px;">
        <div class="form-group">
          <label>余额字段路径 (如 data.balance)</label>
          <input type="text" id="fJsonPath" class="form-control" placeholder="留空则使用平台默认接口">
        </div>
        <div class="form-group">
          <label>币种</label>
          <select id="fCurrency" class="form-control">
            <option value="CNY">人民币 CNY</option>
            <option value="USD">美元 USD</option>
          </select>
        </div>
      </div>
    </details>

    <div style="display: flex; gap: 10px;">
      <button class="btn" style="flex: 1;" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" style="flex: 1;" onclick="saveSite()">保存配置</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastBox"></div>

<script>
// ================= 基础加密与存储 =================
const enc = new TextEncoder();
const dec = new TextDecoder();

async function getCryptoKey(password, salt) {
  const km = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 350000, hash: 'SHA-256' },
    km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
  );
}

async function encryptStr(text, pwd) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await getCryptoKey(pwd, salt);
  const cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(text));
  const buf = new Uint8Array(16 + 12 + cipher.byteLength);
  buf.set(salt, 0); buf.set(iv, 16); buf.set(new Uint8Array(cipher), 28);
  return btoa(String.fromCharCode(...buf));
}

async function decryptStr(b64, pwd) {
  const buf = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const key = await getCryptoKey(pwd, buf.slice(0, 16));
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(16, 28) }, key, buf.slice(28));
  return dec.decode(plain);
}

let appState = { pwd: '', sites: [], editId: null };

// ================= 状态控制 =================
window.onload = () => {
  if (!localStorage.getItem('haoji_vault_pro')) showCreate();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => { for(let reg of regs) reg.unregister(); });
  }
};

function showCreate() { document.getElementById('unlockView').classList.add('hidden'); document.getElementById('createView').classList.remove('hidden'); }
function hideCreate() { document.getElementById('createView').classList.add('hidden'); document.getElementById('unlockView').classList.remove('hidden'); }

async function createVault() {
  const pwd = document.getElementById('newPwd').value;
  if (pwd.length < 6) return toast('密码至少 6 位');
  if (pwd !== document.getElementById('confirmPwd').value) return toast('两次密码不一致');
  appState.pwd = pwd; appState.sites = [];
  await saveState(); enterApp();
}

async function unlock() {
  const pwd = document.getElementById('masterPwd').value;
  const data = localStorage.getItem('haoji_vault_pro');
  if (!data) return toast('保险箱不存在');
  try {
    const str = await decryptStr(data, pwd);
    appState.sites = JSON.parse(str);
    appState.pwd = pwd; enterApp();
  } catch { toast('密码错误'); }
}

function enterApp() {
  document.getElementById('lockScreen').classList.add('hidden');
  document.getElementById('mainApp').classList.remove('hidden');
  renderList(); refreshAllBalances();
}

function lockVault() {
  appState.pwd = ''; appState.sites = [];
  document.getElementById('mainApp').classList.add('hidden');
  document.getElementById('lockScreen').classList.remove('hidden');
  hideCreate();
}

async function saveState() {
  if (!appState.pwd) return;
  const encrypted = await encryptStr(JSON.stringify(appState.sites), appState.pwd);
  localStorage.setItem('haoji_vault_pro', encrypted);
}

// ================= 跨域代理与余额接口适配 =================
// 提供多个公共代理进行容灾
const PROXIES = [
  url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
  url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
];

async function fetchWithProxy(targetUrl, headers) {
  for (let proxyFn of PROXIES) {
    try {
      const res = await fetch(proxyFn(targetUrl), { headers });
      if (res.ok) return await res.json();
    } catch(e) { continue; }
  }
  throw new Error('所有代理节点超时或受限');
}

async function queryBalance(site) {
  const provider = site.provider;
  let url = '';
  let headers = { 'Authorization': `Bearer ${site.key}`, 'Accept': 'application/json' };

  // 1. 确定请求的 API 接口
  if (site.jsonPath && site.baseUrl) {
    url = site.baseUrl.replace(/\/+$/, '') + (site.jsonPath.startsWith('/') ? '' : '/') + site.jsonPath;
  } else {
    switch (provider) {
      case 'deepseek':
        url = 'https://api.deepseek.com/user/balance'; break;
      case 'openrouter':
        url = 'https://openrouter.ai/api/v1/credits'; break;
      case 'moonshot':
        url = 'https://api.moonshot.cn/v1/users/me/balance'; break;
      case 'siliconflow':
        url = 'https://api.siliconflow.cn/v1/user/info'; break;
      case 'newapi':
        url = (site.baseUrl || 'https://api.openai.com').replace(/\/+$/, '') + '/dashboard/billing/credit_grants';
        break;
      default: // auto
        if (site.key.startsWith('sk-or-')) { url = 'https://openrouter.ai/api/v1/credits'; site.provider = 'openrouter'; }
        else if (site.key.startsWith('sk-proj') || site.key.startsWith('sk-ant')) throw new Error('官方默认不开放余额接口');
        else { url = 'https://api.deepseek.com/user/balance'; site.provider = 'deepseek'; }
    }
  }

  // 2. 发起请求
  const data = await fetchWithProxy(url, headers);

  // 3. 解析字段
  let balance = 0;
  let currency = site.currency || 'CNY';

  try {
    if (provider === 'deepseek') {
      balance = parseFloat(data.balance_infos[0].total_balance);
      currency = data.balance_infos[0].currency;
    } else if (provider === 'openrouter') {
      balance = (data.data.total_credits || 0) - (data.data.total_usage || 0);
      currency = 'USD';
    } else if (provider === 'moonshot') {
      balance = parseFloat(data.data.available_balance);
    } else if (provider === 'siliconflow') {
      balance = parseFloat(data.data.totalBalance);
    } else if (provider === 'newapi') {
      // new-api 通常返回总额度，这里做简单兼容
      balance = data.data ? parseFloat(data.data.total_available) : 0;
    } else if (site.jsonPath && data) {
      // 极简路径解析器 (支持 a.b.c 格式)
      const pathArr = site.jsonPath.split('.');
      let cur = data;
      for (let p of pathArr) { cur = cur[p]; }
      balance = parseFloat(cur);
    }
  } catch(e) {
    throw new Error('返回数据格式不符');
  }

  if (isNaN(balance)) throw new Error('解析出的余额非数字');
  return { balance, currency, rawData: data };
}

// ================= 刷新与渲染 =================
async function refreshAllBalances() {
  const btn = document.getElementById('refreshBtn');
  btn.innerHTML = '<span class="spinner"></span> 查询中';
  btn.disabled = true;

  let totalCny = 0; let totalUsd = 0;

  for (let site of appState.sites) {
    try {
      const res = await queryBalance(site);
      site.balance = res.balance;
      site.currency = res.currency;
      site.status = 'active';
      
      if (res.currency === 'CNY') totalCny += res.balance;
      if (res.currency === 'USD') totalUsd += res.balance;
    } catch (err) {
      site.balance = null;
      site.status = 'error';
      site.errMsg = err.message;
    }
  }
  
  document.getElementById('totalCny').textContent = `¥${totalCny.toFixed(2)}`;
  document.getElementById('totalUsd').textContent = `$${totalUsd.toFixed(2)}`;
  document.getElementById('siteCount').textContent = `${appState.sites.length} 个站点`;
  
  await saveState();
  renderList();
  
  btn.innerHTML = '刷新全部余额';
  btn.disabled = false;
}

function renderList() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const list = appState.sites.filter(s => s.name.toLowerCase().includes(q));
  const container = document.getElementById('siteList');
  
  if (list.length === 0) {
    container.innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text2);">暂无站点数据</div>';
    return;
  }

  container.innerHTML = list.map(site => {
    let statusClass = 'unknown';
    if (site.status === 'active') statusClass = 'active';
    if (site.status === 'error') statusClass = 'error';

    let balanceHtml = '<span style="color: var(--text2); font-size: 13px;">未查询</span>';
    if (site.status === 'error') balanceHtml = `<span style="color: var(--danger); font-size: 12px;">查询失败</span>`;
    else if (site.balance !== undefined && site.balance !== null) {
      const symbol = site.currency === 'USD' ? '$' : '¥';
      // 低余额预警 (少于 10 元提示红色)
      const color = site.balance < 10 ? 'var(--warning)' : 'var(--success)';
      balanceHtml = `<span style="color: ${color}; font-family: monospace; font-weight: bold; font-size: 16px;">${symbol} ${site.balance.toFixed(2)}</span>`;
    }

    return `
    <div class="site-card">
      <div class="site-header">
        <div class="site-name">
          <span class="status-dot ${statusClass}"></span>
          ${escapeHtml(site.name)}
          <span class="tag">${site.provider}</span>
        </div>
        <div style="display: flex; gap: 6px;">
          <button class="btn btn-sm" onclick="openModal('${site.id}')">✏️</button>
          <button class="btn btn-sm btn-danger" onclick="deleteSite('${site.id}')">🗑️</button>
        </div>
      </div>
      <div class="key-row">
        <span class="key-text">${maskKey(site.key)}</span>
        <button class="btn btn-sm" onclick="copyText('${escapeHtml(site.key)}')">复制</button>
      </div>
      <div class="balance-info">
        <span style="color: var(--text2);">当前余额</span>
        <div>${balanceHtml}</div>
      </div>
    </div>`;
  }).join('');
}

// ================= 站点管理 =================
function openModal(id = null) {
  appState.editId = id;
  const site = id ? appState.sites.find(s => s.id === id) : { name:'', key:'', provider:'auto', baseUrl:'', jsonPath:'', currency:'CNY' };
  document.getElementById('modalTitle').textContent = id ? '编辑站点' : '添加站点';
  document.getElementById('fName').value = site.name;
  document.getElementById('fKey').value = site.key;
  document.getElementById('fProvider').value = site.provider;
  document.getElementById('fBaseUrl').value = site.baseUrl || '';
  document.getElementById('fJsonPath').value = site.jsonPath || '';
  document.getElementById('fCurrency').value = site.currency || 'CNY';
  document.getElementById('editModal').classList.add('show');
}

async function saveSite() {
  const name = document.getElementById('fName').value.trim();
  const key = document.getElementById('fKey').value.trim();
  if (!name || !key) return toast('名称和 Key 不能为空');

  const entry = {
    id: appState.editId || Date.now().toString(36),
    name, key,
    provider: document.getElementById('fProvider').value,
    baseUrl: document.getElementById('fBaseUrl').value.trim(),
    jsonPath: document.getElementById('fJsonPath').value.trim(),
    currency: document.getElementById('fCurrency').value,
    status: 'unknown', balance: null
  };

  if (appState.editId) {
    const i = appState.sites.findIndex(s => s.id === appState.editId);
    appState.sites[i] = { ...appState.sites[i], ...entry };
  } else {
    appState.sites.push(entry);
  }
  
  await saveState(); closeModal(); renderList();
  refreshAllBalances(); // 保存后自动刷新
}

async function deleteSite(id) {
  if (!confirm('确认删除此站点配置？')) return;
  appState.sites = appState.sites.filter(s => s.id !== id);
  await saveState(); renderList(); refreshAllBalances();
}

function closeModal() { document.getElementById('editModal').classList.remove('show'); }

// ================= 导出与备份 =================
async function exportVault() {
  if (!appState.sites.length) return toast('没有数据');
  // 导出时依然使用主密码加密，确保即使文件泄露，无密码也打不开
  const content = JSON.stringify(appState.sites);
  const encryptedBlob = await encryptStr(content, appState.pwd);
  
  const blob = new Blob([encryptedBlob], {type: 'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `Vault_Backup_${new Date().toISOString().slice(0,10)}.vault`;
  a.click();
  toast('加密备份已下载');
}

// ================= 工具函数 =================
function escapeHtml(str) { return str ? str.replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])) : ''; }
function maskKey(key) { return key.length > 10 ? key.slice(0,6) + '••••' + key.slice(-4) : key; }
function copyText(text) {
  navigator.clipboard.writeText(text).then(() => toast('已复制')).catch(() => toast('复制失败'));
}
function toast(msg) {
  const box = document.getElementById('toastBox');
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  box.appendChild(el); setTimeout(() => el.remove(), 2500);
}

document.getElementById('editModal').addEventListener('click', e => {
  if (e.target === document.getElementById('editModal')) closeModal();
});
</script>
